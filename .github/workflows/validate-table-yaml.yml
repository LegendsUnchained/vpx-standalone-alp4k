name: Validate table.yml

on:
  pull_request:
    paths:
      - '**table.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # No git-history diffing is needed in this workflow; changed files are
          # resolved through the PR Files API.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: '.github/workflows/scripts/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/scripts/requirements.txt
          pip install yamllint

      - name: Get changed table.yml files from PR
        id: changed-files
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              });

              const tableFiles = files
                .map((f) => f.filename)
                .filter((name) => name.endsWith('table.yml'));

              core.setOutput('table_files', tableFiles.join('\n'));
              core.info(`Found ${tableFiles.length} changed table.yml file(s).`);
            } else {
              core.setOutput('table_files', '__ALL__');
              core.info('workflow_dispatch run: validating all external/**/table.yml files.');
            }

      - name: Validate table.yml files
        run: |
          if [[ "${{ steps.changed-files.outputs.table_files }}" == "__ALL__" ]]; then
            mapfile -t FILES < <(find external -type f -name 'table.yml' | sort)
          elif [[ -z "${{ steps.changed-files.outputs.table_files }}" ]]; then
            echo "No changed table.yml files reported by PR Files API; nothing to validate."
            exit 0
          else
            mapfile -t FILES < <(printf '%s\n' "${{ steps.changed-files.outputs.table_files }}" | sed '/^$/d')
          fi

          echo "Running validator on ${#FILES[@]} changed file(s) with VPSDB checks..."
          python .github/workflows/scripts/validate-table-yaml.py "${FILES[@]}"

          echo "Running yamllint on changed table.yml file(s)..."
          for file in "${FILES[@]}"; do
            if [[ -f "$file" ]]; then
              yamllint -c .yamllint "$file"
            fi
          done