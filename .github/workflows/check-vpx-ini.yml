name: Check table.ini

on:
  pull_request:
    paths:
      - '**table.ini'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # This workflow only validates changed table.ini files and gets that
          # file list from the PR Files API, so no merge ref or deep history is
          # required.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Checkout diagnostics
        run: |
          echo "event=${{ github.event_name }}"
          echo "repository=${{ github.event.pull_request.head.repo.full_name || github.repository }}"
          echo "ref=${{ github.event.pull_request.head.sha || github.sha }}"
          echo "git_commit=$(git rev-parse HEAD)"
          echo "git_remote=$(git remote get-url origin)"
          git count-objects -vH
          du -sh .git

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Get changed table.ini files from PR
        id: changed-files
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const iniFiles = files
              .map((f) => f.filename)
              .filter((name) => name.endsWith('table.ini'));

            core.setOutput('table_files', iniFiles.join('\n'));
            core.info(`Found ${iniFiles.length} changed table.ini file(s).`);
  
      - name: Check table.ini files
        run: |
          if [[ -z "${{ steps.changed-files.outputs.table_files }}" ]]; then
            echo "No table.ini files were changed."
            exit 0
          fi

          mapfile -t FILES < <(printf '%s\n' "${{ steps.changed-files.outputs.table_files }}" | sed '/^$/d')
          for file in "${FILES[@]}"; do
            echo "Checking \"$file\""
            python .github/workflows/scripts/check-table-ini.py "$file" "Default_VPinballX.ini"
          done