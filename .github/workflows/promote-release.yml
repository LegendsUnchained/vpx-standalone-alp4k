name: Promote prerelease to stable

# The deliberate half of the prerelease-first pipeline.
#
# Assets are built onto a prerelease by "Build release assets", and mirrored to
# the manifest-testing branch for vetting. A prerelease is public but excluded
# from /releases/latest, so stable clients keep being served the previous
# release until this workflow runs.
#
# Order matters and is enforced by job dependencies: the stable `manifest`
# mirror is updated FIRST, then the release is published. Publishing first
# would point users at a release whose catalog data had not landed yet.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag of the prerelease to promote'
        required: true
        type: string
      make_latest:
        description: 'Mark this release as "Latest" once published'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    name: Check the prerelease is promotable
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
    outputs:
      id: ${{ steps.rel.outputs.id }}
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - name: Resolve the prerelease
        id: rel
        run: |
          tag="$TAG"
          # env.TAG, not --arg: `gh api --jq` takes a single filter and does
          # not accept jq's own flags.
          read -r id prerelease draft assets < <(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '.[] | select(.tag_name==env.TAG) | "\(.id) \(.prerelease) \(.draft) \(.assets|length)"' | head -1)
          if [ -z "$id" ]; then
            echo "::error::No release found with tag '$tag'."
            exit 1
          fi
          if [ "$draft" = "true" ]; then
            echo "::error::Release '$tag' is a draft. Publish it as a prerelease first."
            exit 1
          fi
          if [ "$prerelease" != "true" ]; then
            echo "::error::Release '$tag' is already stable. Nothing to promote."
            exit 1
          fi
          if [ "$assets" = "0" ]; then
            echo "::error::Prerelease '$tag' has no assets — has the release build run yet?"
            exit 1
          fi
          echo "Promoting prerelease '$tag' (id $id, $assets assets)"
          { echo "id=$id"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"

  # Step 1: move the STABLE catalog mirror onto the exact commit the testing
  # mirror already holds.
  #
  # A ref copy, not a rebuild. Rebuilding re-downloaded the release assets,
  # re-encoded the box art and re-fetched the vpinmdb media, which meant stable
  # could be handed different bytes than testing was vetted with — art changing
  # underneath a promotion is precisely what promotion is supposed to rule out.
  # Every re-encode that is not byte-identical also writes new blobs for
  # content that did not change.
  #
  # Copying the ref is reproducible by construction: same tree, same blobs, all
  # of which already exist, so it adds nothing to the pack and takes seconds.
  #
  # `manifest` keeps the objects alive on its own. Git holds an object for as
  # long as any ref reaches it, so once this points at that commit, later
  # candidates force-pushing manifest-testing — or deleting it outright — cannot
  # take it away.
  mirror:
    name: Point the stable manifest branch at the tested one
    needs: validate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Checkout the mirror branches
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: The tested mirror must be the one built for this release
        run: |
          set -euo pipefail
          git fetch -q origin manifest-testing
          git show origin/manifest-testing:manifest.json > /tmp/testing-manifest.json

          # Trust the contents, not the commit message: manifest.json names the
          # release its assets live in, so it is the mirror's own account of what
          # it was built from. A stale mirror is otherwise indistinguishable from
          # a current one, and promoting it would point stable at a candidate
          # that never shipped.
          total=$(jq 'length' /tmp/testing-manifest.json)
          match=$(jq --arg t "$TAG" '[ .[]
            | select((.repoConfig // "")
            | contains("/releases/download/" + $t + "/")) ] | length' /tmp/testing-manifest.json)
          echo "manifest-testing: $match of $total entries reference $TAG"
          if [ "$total" -eq 0 ] || [ "$match" -eq 0 ]; then
            echo "::error::manifest-testing does not reference $TAG. It was built for a"
            echo "::error::different release; re-run Publish Catalog Data for $TAG first."
            exit 1
          fi

      - name: Copy the ref onto manifest
        run: |
          set -euo pipefail
          before=$(git rev-parse origin/manifest 2>/dev/null || echo none)
          target=$(git rev-parse origin/manifest-testing)
          echo "manifest $before -> $target"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "$target:refs/heads/manifest"

      - name: Stable and testing now hold identical trees
        run: |
          set -euo pipefail
          git fetch -q origin manifest manifest-testing
          a=$(git rev-parse origin/manifest^{tree})
          b=$(git rev-parse origin/manifest-testing^{tree})
          echo "manifest tree=$a  manifest-testing tree=$b"
          [ "$a" = "$b" ] || { echo "::error::trees differ after the promote"; exit 1; }

  # Step 2: only now does the release become visible to users.
  publish:
    name: Publish the release
    needs: [validate, mirror]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Flip prerelease to stable
        run: |
          # Clearing `prerelease` is what makes this release visible to
          # /releases/latest, and therefore to stable clients.
          gh api -X PATCH "repos/${{ github.repository }}/releases/${{ needs.validate.outputs.id }}" \
            -F prerelease=false \
            -F make_latest=${{ inputs.make_latest }} \
            --jq '"promoted: \(.tag_name)  prerelease=\(.prerelease)  url=\(.html_url)"'

      # The promoted release is no longer a prerelease, so anything still
      # flagged as one is a candidate that was superseded rather than shipped.
      # Left alone it lingers in the release list forever; internal devices are
      # protected from following it by the newer-than-stable check in
      # resolveWizardRelease, but the invariant is "exactly one open
      # prerelease", so sweep them here. Runs after the promotion succeeded, so
      # a failed promote never deletes a candidate.
      - name: Delete superseded prereleases
        run: |
          leftovers=$(gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq '.[] | select(.prerelease and (.draft | not)) | .tag_name')
          if [ -z "$leftovers" ]; then
            echo "No superseded prereleases to remove."
            exit 0
          fi
          echo "$leftovers" | while read -r tag; do
            [ -z "$tag" ] && continue
            echo "Deleting superseded prerelease $tag (and its tag)"
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
          done

      - name: Confirm stable clients now resolve it
        run: |
          tag="${{ needs.validate.outputs.tag }}"
          latest=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ "$latest" = "$tag" ]; then
            echo "/releases/latest now resolves to $tag"
          else
            echo "::warning::/releases/latest is '$latest', not '$tag' — expected unless make_latest was false."
          fi
