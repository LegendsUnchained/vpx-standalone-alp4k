name: Promote Release

# Promotes tables from the rolling pre-release into a NEW stable release:
# everything in it (`all`), or only the tables named.
#
#   check -> assemble draft -> stable catalog mirror -> publish -> sync -> notify
#
# Tables only ever reach stable through the pre-release, and only as they are
# on main: every promoted table's folder on main must be the exact one the
# pre-release built (configVersion == tree id). Otherwise the run refuses
# until Sync Pre-release has caught up.
#
# Nothing is rebuilt. The promoted zips are copied byte for byte out of the
# pre-release, so stable ships what testers vetted. Afterwards the pre-release
# is synced again, which drops what was promoted from it.
#
# dry_run (the default) stops after the check, in seconds. Bots run it first,
# read the `promotion-check` artifact, confirm with a human, then run again
# with dry_run=false and expected_prerelease set to the manifest md5 the dry
# run reported. See .github/workflows/scripts/release-pipeline.md.

run-name: >-
  Promote ${{ inputs.tables }}${{ inputs.dry_run && ' (dry run)' || '' }}${{ inputs.request_id && format(' [{0}]', inputs.request_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      tables:
        description: '`all`, or the table keys to promote (comma, space or newline separated)'
        required: true
        default: all
        type: string
      dry_run:
        description: 'Only check whether the request can be promoted'
        required: false
        default: true
        type: boolean
      release_tag:
        description: 'Tag for the new stable release (blank = next free patch)'
        required: false
        type: string
      expected_prerelease:
        description: 'Refuse unless the pre-release manifest still has this md5 (bots: pass the dry-run value)'
        required: false
        type: string
      request_id:
        description: 'Free-form id echoed in the run name, for callers finding their run'
        required: false
        type: string

permissions:
  contents: write
  actions: write

# Real runs queue behind each other; dry runs read only, so they get a group
# of their own and never wait. Not shared with Sync Pre-release: GitHub keeps
# one waiting run per group and cancels it when a newer one queues, so a sync
# triggered by a merge would cancel a waiting promotion.
concurrency:
  group: ${{ inputs.dry_run && format('promote-check-{0}', github.run_id) || 'promotion' }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the request
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    outputs:
      promotable: ${{ steps.check.outputs.promotable }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/workflows/scripts

      - name: Validate against the pre-release, stable and main
        id: check
        env:
          TABLES: ${{ inputs.tables }}
          EXPECTED: ${{ inputs.expected_prerelease }}
          TAG: ${{ inputs.release_tag }}
        run: |
          python3 .github/workflows/scripts/promotion.py check \
            --tables "$TABLES" --branch "${{ github.event.repository.default_branch }}" \
            --expected-prerelease "$EXPECTED" --release-tag "$TAG" \
            --out promotion-check.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep the verdict for callers and later jobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-check
          path: promotion-check.json
          if-no-files-found: ignore

  assemble:
    name: Assemble the stable release
    needs: check
    if: ${{ !inputs.dry_run && needs.check.outputs.promotable == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.check.outputs.tag }}
    outputs:
      id: ${{ steps.assemble.outputs.id }}
      mirror_before: ${{ steps.push.outputs.before }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: promotion-check

      - name: Set up Python 3.11 (with pip cache)
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: '**/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r .github/workflows/scripts/requirements.txt

      - name: Create the draft and copy the promoted bundles into it
        id: assemble
        run: python .github/workflows/scripts/promotion.py assemble --plan promotion-check.json --out-dir promotion-out

      - name: Release notes
        run: |
          python .github/workflows/scripts/generate-release-notes.py --manifest promotion-out/manifest.json
          python .github/workflows/scripts/promotion.py finalize-body \
            --plan promotion-check.json --release-id "${{ steps.assemble.outputs.id }}"

      # Before publishing, as with every catalog update: publishing first would
      # point the public catalog at data that had not landed yet.
      - name: Build the stable catalog commit
        id: mirror
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git fetch -q --depth 1 origin \
            +refs/heads/manifest:refs/remotes/origin/manifest \
            +refs/heads/manifest-testing:refs/remotes/origin/manifest-testing
          python .github/workflows/scripts/promotion.py mirror --plan promotion-check.json --data-dir promotion-out

      - name: Point manifest at it
        id: push
        run: |
          set -euo pipefail
          before=$(git rev-parse origin/manifest)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "manifest $before -> ${{ steps.mirror.outputs.commit }}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "${{ steps.mirror.outputs.commit }}:refs/heads/manifest"

  publish:
    name: Publish the release
    needs: [check, assemble]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Publish as the latest release
        run: |
          # tag_name repeated on purpose: a draft PATCHed without it can lose
          # its tag and publish as untagged-<hash>. make_latest matters: Table
          # Manager's stable track and every fork read /releases/latest.
          gh api -X PATCH "repos/${{ github.repository }}/releases/${{ needs.assemble.outputs.id }}" \
            -f tag_name="$TAG" -F draft=false -F prerelease=false -f make_latest=true \
            --jq '"published: \(.tag_name)  \(.html_url)"'

      - name: The tag landed on the commit that was checked
        run: |
          want=$(gh api "repos/${{ github.repository }}/releases/${{ needs.assemble.outputs.id }}" --jq .target_commitish)
          got=$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq .object.sha)
          echo "tag $TAG -> $got (target $want)"
          [ "$got" = "$want" ] || { echo "::error::$TAG points at $got, expected $want"; exit 1; }

      - name: Stable clients resolve it
        run: |
          latest=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          echo "/releases/latest -> $latest"
          [ "$latest" = "$TAG" ] || { echo "::error::/releases/latest is $latest, not $TAG"; exit 1; }

  # Rebases the pre-release on the new stable, so what was promoted leaves it.
  # A dispatch made with the workflow token is one of the events that does
  # start a run.
  sync:
    name: Re-sync the pre-release
    needs: publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh workflow run sync-prerelease.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"

  notify:
    name: Post the promoted tables to Discord
    needs: [assemble, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Send the stable release embed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.assemble.outputs.id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_STABLE_RELEASE_WEBHOOK_URL }}
        run: |
          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" > "$RUNNER_TEMP/promoted-release.json"
          python3 .github/workflows/scripts/notify-discord-release.py --kind stable "$RUNNER_TEMP/promoted-release.json"

  # Only an unpublished promotion is undone. Once the release is public,
  # devices may already be reading it, so a failure after that point is left
  # for a human: rolling the catalog back would point it at an older release
  # than the one /releases/latest serves.
  cleanup:
    name: Undo a failed promotion
    needs: [check, assemble, publish]
    if: failure() && needs.check.result == 'success' && !inputs.dry_run
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
      ID: ${{ needs.assemble.outputs.id }}
    steps:
      - name: Delete the unpublished draft
        id: draft
        run: |
          # By tag as well as id: assemble may have failed before reporting it.
          ids=$(gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq '.[] | select(.draft and (.tag_name == env.TAG or (.id|tostring) == env.ID)) | .id')
          for id in $ids; do
            echo "Deleting draft $TAG (id $id)"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done
          published=$(gh api "repos/${{ github.repository }}/releases/${ID:-0}" --jq '.draft | not' 2>/dev/null || echo false)
          echo "published=$published" >> "$GITHUB_OUTPUT"
          if [ "$published" = "true" ]; then
            echo "::error::Release $ID was published before the run failed. Check it, /releases/latest and the manifest branch by hand."
          fi

      - name: Put the stable catalog back
        if: needs.assemble.outputs.mirror_before != '' && steps.draft.outputs.published != 'true'
        run: |
          before="${{ needs.assemble.outputs.mirror_before }}"
          echo "Restoring manifest to $before"
          git init -q restore && cd restore
          git fetch -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$before"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "$before:refs/heads/manifest"
