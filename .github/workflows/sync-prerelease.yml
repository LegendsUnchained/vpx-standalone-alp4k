name: Sync Pre-release

# Keeps the rolling `pre-release` release in step with main: every Wizard table
# that differs from stable, zipped once per version, plus a full testing
# manifest (stable with that delta applied) for Table Manager's testing tracks
# and the testing catalog mirror. Promote Release moves tables from it to
# stable. See .github/workflows/scripts/release-pipeline.md.
#
# A sync reconciles to main, so it is safe to run any time and as often as
# wanted: when nothing changed it uploads nothing. Bursts of merges coalesce:
# one sync runs at a time and each newer request replaces the one waiting.
#
# On by default in LegendsUnchained/vpx-standalone-alp4k. The repository
# variable PRERELEASE_SYNC turns it off there ('false') or on in a fork
# ('true'); forks otherwise publish with Create Fork Release.

on:
  push:
    branches: [main]
    paths:
      - 'tables/**'
      - 'tm-config/**'
      - 'team_favorites.json'
      - 'editors_picks.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerelease-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync the pre-release with main
    if: >-
      vars.PRERELEASE_SYNC == 'true' ||
      (github.repository == 'LegendsUnchained/vpx-standalone-alp4k' && vars.PRERELEASE_SYNC != 'false')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      # The branch tip, not the triggering commit: a run that waited behind
      # another should sync whatever main is now.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          filter: blob:none

      - name: Set up Python 3.11 (with pip cache)
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: '.github/workflows/scripts/requirements*.txt'

      - name: Install Python dependencies
        run: |
          pip install -r .github/workflows/scripts/requirements.txt \
                      -r .github/workflows/scripts/requirements-catalog-publish.txt

      - name: Sync
        id: sync
        run: |
          python .github/workflows/scripts/prerelease.py sync \
            --out-dir prerelease-out --summary "$GITHUB_STEP_SUMMARY"

      # Only tables new to the pre-release, or with a new version in it. A
      # missing webhook (forks) or a Discord outage never fails the sync.
      - name: Tell testers what arrived
        if: steps.sync.outputs.announce != ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_TESTING_RELEASE_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No testing webhook configured; not posting."
            exit 0
          fi
          python3 .github/workflows/scripts/notify-discord-release.py --kind testing "${{ steps.sync.outputs.announce }}"
