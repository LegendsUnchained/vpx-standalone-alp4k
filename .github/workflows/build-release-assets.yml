name: Build release assets

permissions:
  contents: write
  pull-requests: write

# Prerelease-first: assets are built onto a PRERELEASE so the team can vet a
# candidate while stable users keep being served the published release.
# GitHub excludes prereleases from /releases/latest, so stable clients never
# see one — no gating of our own required. Promotion to stable is a separate,
# deliberate step (promote-release.yml).
#
# Not triggered by release events. "Create Testing Release" owns the flow: it
# creates a draft, calls this workflow to fill it, mirrors the catalog, and only
# then publishes. Reacting to `prereleased` here would fire a second, duplicate
# build the moment that workflow published its own draft.
on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Tag of the release to build (may be an unpublished draft)'
        required: true
        type: string
      ref:
        description: 'Commit to build from. Defaults to the calling ref.'
        required: false
        type: string
      release_id:
        description: >-
          Numeric id of the release to build. Optional; when the caller already
          has it (it just created the draft), passing it skips looking the
          release up by tag.
        required: false
        type: string
        default: ''
  # Manual re-run against an existing release.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag of the release to build'
        required: true

jobs:
  create_zips_and_manifest:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      # NOT GITHUB_REF_NAME. That name is reserved: the runner injects its own
      # value into every step, overriding anything set here, and for a
      # workflow_dispatch on main that value is "main" — which the scripts then
      # looked up as a release. It only ever appeared to work because a release
      # event's built-in GITHUB_REF_NAME happens to be the tag.
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_ID: ${{ inputs.release_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # An explicit commit when the caller supplies one: a draft has no tag
          # to check out, and pinning the sha means a push to the branch part
          # way through cannot change what this build produces.
          ref: ${{ inputs.ref || github.ref }}
          # Full commit graph is required for catalog_history.table_renames,
          # which diffs the previous release tag against this one to carry a
          # renamed table's arrival date across. (configVersion no longer needs
          # it: it is the folder's tree id, read straight off this commit.)
          # A blobless partial clone keeps all commits + tree objects but
          # skips historical blob content, cutting the initial transfer
          # dramatically as tables/ grows. Blobs for the current tip are
          # fetched on demand when the release script reads folder files.
          fetch-depth: 0
          filter: blob:none
          submodules: false
          lfs: false

      - name: Checkout diagnostics
        run: |
          echo "event=${{ github.event_name }}"
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "git_commit=$(git rev-parse HEAD)"
          echo "git_remote=$(git remote get-url origin)"
          echo "promisor=$(git config --local --get remote.origin.promisor || true)"
          echo "partialclonefilter=$(git config --local --get remote.origin.partialclonefilter || true)"
          git count-objects -vH
          du -sh .git

      - name: Set up Python 3.11 (with pip cache)
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: '**/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/scripts/requirements.txt

      - name: Test discovery history
        run: python -m unittest discover -s .github/workflows/scripts -p test_catalog_history.py

      - name: Full table.yml validation (release gate)
        run: |
          echo "Running full table.yml validation across tables/ with VPSDB checks..."
          python .github/workflows/scripts/validate-table-yaml.py

      - name: Generate changed zips only
        run: python .github/workflows/scripts/generate-release.py

      - name: Update Release notes (optional)
        # manifest.json is still in the workspace from the previous step.
        run: python .github/workflows/scripts/generate-release-notes.py --manifest manifest.json

      # Disabled 2026-09-10: this generator sources each row's title and stats by
      # parsing the per-table README's `# Title` heading and Status table. Those
      # READMEs were replaced with a pointer to the Table Manager Wizard catalog,
      # so it now finds 315 tables with no heading and 316 with no parseable
      # status, and would rewrite README.md with degraded rows on every release.
      # To re-enable, drop `if: false` once the generator reads table.yml instead.
      - name: Regenerate README table listings
        id: readme_gen
        if: false
        run: |
          # On a release run, rewrite README.md in place and stage the change.
          # On a manual workflow_dispatch run, only print what would change
          # (dry-run) so operators can review before committing.
          if [ "${{ github.event_name }}" = "release" ]; then
            python .github/workflows/scripts/generate-readme-tables.py
          else
            echo "workflow_dispatch: dry-run only (no README write, no commit)."
            python .github/workflows/scripts/generate-readme-tables.py --check
          fi

      - name: Table Manager Achievements Config
        run: |
          set -uo pipefail
          # Uploaded through the API rather than `gh release upload <tag>`:
          # that resolves the tag endpoint, which cannot see a draft, and the
          # release is still a draft at this point in the pipeline.
          repo="${{ github.repository }}"

          # GitHub's API returns intermittent 502/504s. Retry with backoff.
          retry() {
            local n=1 max=5 delay=5
            until "$@"; do
              if [ "$n" -ge "$max" ]; then
                echo "::error::Failed after $max attempts: $*" >&2
                return 1
              fi
              echo "::warning::Attempt $n failed; retrying in ${delay}s: $*" >&2
              sleep "$delay"; n=$((n + 1)); delay=$((delay * 2))
            done
          }

          id="$RELEASE_ID"
          if [ -z "$id" ]; then
            # Page through releases a few at a time and stop at the first
            # match. The old `--paginate` fetched every release with its full
            # asset list in one go; with hundreds of zips per release that
            # response grew until GitHub timed out building it (HTTP 504).
            # Newest releases (including this draft) come first.
            for page in $(seq 1 50); do
              ids=$(retry gh api "repos/$repo/releases?per_page=10&page=$page" \
                      --jq '[.[] | {id, tag_name, draft}]') || exit 1
              [ "$ids" = "[]" ] && break
              id=$(TAG="$RELEASE_TAG" jq -r \
                     '[.[] | select(.tag_name==env.TAG)] | sort_by(.draft) | reverse | .[0].id // empty' \
                     <<< "$ids")
              [ -n "$id" ] && break
            done
          fi
          if [ -z "$id" ]; then
            echo "::error::No release found for tag '$RELEASE_TAG'."
            exit 1
          fi

          # --clobber equivalent: the API refuses a duplicate asset name. Done
          # inside the retried block too, so a retry after an upload that
          # actually landed (despite a 504) doesn't hit "already_exists".
          upload() {
            local old a
            old=$(gh api "repos/$repo/releases/$id/assets?per_page=100" --paginate \
                    --jq '.[] | select(.name=="achievements.json") | .id') || return 1
            for a in $old; do gh api -X DELETE "repos/$repo/releases/assets/$a" || return 1; done
            gh api --method POST \
              -H "Content-Type: application/json" \
              "https://uploads.github.com/repos/$repo/releases/$id/assets?name=achievements.json" \
              --input tm-config/achievements.json > /dev/null
          }
          retry upload || exit 1
          echo "Uploaded achievements.json to release $id ($RELEASE_TAG)"

      # Disabled 2026-09-10: paired with the regeneration step above. With that
      # step off there is never a README.md change to raise a PR for.
      # Original condition: github.event_name == 'release'
      - name: Open PR for README updates
        if: false
        run: |
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "No README changes to commit."
            exit 0
          fi
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          SAFE_TAG=$(echo "${RELEASE_TAG}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s#^-+##; s#-+$##')
          if [ -z "$SAFE_TAG" ]; then
            SAFE_TAG="release-${GITHUB_RUN_ID}"
          fi
          PR_BRANCH="chore/regenerate-readme-tables-${SAFE_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$DEFAULT_BRANCH"
          # Base the PR branch on the current tip of the default branch so the
          # diff is limited to the regenerated README, even though this workflow
          # runs at the release tag ref.
          git checkout -B "$PR_BRANCH" "origin/$DEFAULT_BRANCH"
          python .github/workflows/scripts/generate-readme-tables.py
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "No README changes after rebasing onto $DEFAULT_BRANCH."
            exit 0
          fi
          git add README.md
          git commit -m "chore: regenerate README table listings [skip ci]"
          # Repository rules may disallow force-push, so use a release-scoped
          # branch and a normal push.
          if ! git push origin "HEAD:$PR_BRANCH"; then
            ALT_BRANCH="${PR_BRANCH}-${GITHUB_RUN_ID}"
            echo "::warning::Push to ${PR_BRANCH} failed; retrying with ${ALT_BRANCH}."
            git push origin "HEAD:$ALT_BRANCH"
            PR_BRANCH="$ALT_BRANCH"
          fi
          # Reuse an existing open PR for this branch if there is one; otherwise
          # open a new one against the protected default branch. Retry a few
          # times to ride out transient GitHub GraphQL failures.
          EXISTING_PR=$(gh pr list --head "$PR_BRANCH" --base "$DEFAULT_BRANCH" --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING_PR" ]; then
            echo "Existing PR #$EXISTING_PR updated with new README regeneration commit."
            exit 0
          fi
          MANUAL_URL="https://github.com/${GITHUB_REPOSITORY}/pull/new/${PR_BRANCH}"
          for attempt in 1 2 3 4 5; do
            if gh pr create \
                --base "$DEFAULT_BRANCH" \
                --head "$PR_BRANCH" \
                --title "chore: regenerate README table listings" \
                --body "Automated regeneration of the Wizard Tables and Manual Install Tables sections in README.md, triggered by release \`${RELEASE_TAG}\`."; then
              exit 0
            fi
            echo "::warning::gh pr create attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "::warning::Could not open PR after retries. Branch '${PR_BRANCH}' is pushed; open a PR manually at ${MANUAL_URL}"
          # Don't fail the whole workflow just because the PR API was flaky;
          # the branch is already on the remote and the next release run will
          # try again (and reuse it if a PR has been opened in the meantime).
          exit 0
