# Static half of the generated site config. build.py copies this verbatim and
# appends the nav it derives from the wiki page names.
site_name: VPXS 4KP Wiki
site_url: https://wiki.legendsunchained.com/
site_description: Documentation for the VPX Standalone 4KP project.
repo_url: https://github.com/LegendsUnchained/vpx-standalone-alp4k
edit_uri: ""

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  # Copied into docs/assets by build.py, alongside tm.css.
  logo: assets/header.svg
  language: en
  # The Table Manager skin ships Orbitron / Manrope / Roboto Mono from
  # overrides/main.html. Leaving this on would also pull Material's Roboto.
  font: false
  features:
    - navigation.top
    - navigation.tracking
    - navigation.sections
    # navigation.indexes is deliberately off: build.py writes every page as
    # <slug>/index.md, so Material would absorb the first page of each track
    # into its section heading and drop its row from the rail.
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
  # Dark only: the skin has no light branch, so there is no palette toggle.
  palette:
    - scheme: slate
      primary: black
      accent: cyan

extra_css:
  - assets/tm.css

plugins:
  - search

markdown_extensions:
  # The wiki leans on raw HTML (<picture>, <p align>, <br>, <details>), so
  # keep HTML passthrough and attribute support on.
  - attr_list
  - md_in_html
  - meta
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.com/invite/moxs
      name: Mox's Game Room on Discord
