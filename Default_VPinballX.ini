; # B2SDMD auto-place
; Auto-place finds the black rectangle a backglass reserves for its DMD and drops the real DMD
; into it. Everything below the first two switches only refines that, and is ignored while both
; switches are off.
B2SDMDAutoPlacePinMAME = 1
; Same treatment for a PUP DMD. Defaults to whatever B2SDMDAutoPlacePinMAME is.
B2SDMDAutoPlacePUPDMD =
; Which PUP screen the placed DMD is measured against. Defaults to the pack's FullDMD screen if
; it has one, else its DMD screen.
B2SDMDAutoPlacePUPScreen =
; Nudge the placed DMD, in pixels. Default 0.
B2SDMDAutoPlaceOffsetX =
B2SDMDAutoPlaceOffsetY =
; Uniform scale applied to the detected rectangle. Default -1, meaning unset, which falls through
; to B2SDMDAutoPlaceScaleX (default 1.0).
B2SDMDAutoPlaceScale =
B2SDMDAutoPlaceScaleX =
; Reject a candidate rectangle whose aspect differs from the DMD's by more than this fraction.
; Default 0.25.
B2SDMDAutoPlaceMaxAspectSkew =
; Refuse to auto-place when the backglass is already drawing its own score reels -- that black
; area is artwork, not a slot. Default on.
B2SDMDAutoPlaceRequireNoB2SScores =
; Render at the DMD's native dot size and scale on present, rather than rendering at the placed
; rectangle's size. Default on.
B2SDMDPreserveNativeRenderSize =
; Give the B2S DMD its own render thread. Default OFF on RK3588 (on elsewhere) -- aux windows
