; # Color DMD Upscaling
; 0 = None (default), 1 = Scale2x, 2 = ScaleDouble (doubled pixels).
VniScalerMode = 2
; For SERUMs only. Turn off if it flickers excessively.
; 0 = None (default), 1 = ScaleDouble.
ScalerMode = 1

; # DMD Dot Style (PinMAME DMD window)
; Renders the DMD as discrete dots on a dark grid instead of a flat scaled bitmap. All of these are
; live-tunable from the in-game UI's DMD Options page; the values here are what it starts from.
; Master switch for everything in this block. Default off.
DMDDotStyle = 1
; Dot diameter as a fraction of its cell; 1.0 = touching. Default 0.75.
DMDDotSize = 0.75
; Edge falloff; lower is softer/blurrier. Default 0.90.
DMDDotSharpness = 0.90
; Multiplier on lit dots. Default 1.0.
DMDDotBrightness = 1.0
; Output pixels per DMD dot. Default 12.
DMDDotScale = 12
; Colour of dots that are off, one 0..255 channel each. Default 64/64/64 -- the neutral grid a
; plasma DMD shows. All three at 0 hides the grid entirely. The in-game UI offers presets for
; these (Off, Grey, and each dot colour at a quarter intensity), but they are only a shortcut for
; filling the three channels: nothing is stored for the preset, and these are what render.
DMDDotUnlitColorR = 64
DMDDotUnlitColorG = 64
DMDDotUnlitColorB = 64
; Stricter dot geometry, at more fragment cost. Default off.
DMDDotAccurate =
; Dot colour, for plain (non-colorized) sources only -- Serum and FlexDMD keep their own colours.
; 0 = Source (no tint at all), 1 = Neon Plasma, 2 = Red LED, 3 = Green LED, 4 = Yellow LED,
; 5 = Blue LED, 6 = White, 7 = Custom. Out of range falls back to 0. Default 0.
; Anything other than Source tints by the three channels below; 1..6 are shortcuts that fill them.
DMDDotTintPreset =
; The tint itself, one 0..255 channel each. Defaults follow DMDDotTintPreset, so setting only the
; preset still gives that preset's colour. Default 255/82/45 (Neon Plasma) when neither is set.
DMDDotTintR =
DMDDotTintG =
DMDDotTintB =

; # DMD Bezel
; Composites <table dir>/dmdframe.png around the PinMAME DMD. Applies to the PinMAME window only,
; and silently does nothing if the table ships no dmdframe.png. Default off.
DMDFrame =

; # PAC support
VniKey = f0ad135937ffa111c60b24d88ebb2e59

; # Big table tuning
; Defers texture upload work across early rendered frames instead of uploading everything during
; startup in one burst. Helps reduce startup memory spikes and long stalls.
StartupTextureWarmupDeferred = 1
; Maximum time budget per frame, in milliseconds, for deferred startup texture uploads. Lower
; values reduce frame hitches but take more frames to finish warming textures.
StartupTextureWarmupBudgetMs = 4
; Maximum total texture data, in MB, to upload per frame during deferred warmup. Helps cap memory
; bandwidth and temporary upload pressure.
StartupTextureWarmupBudgetMB = 32
; Maximum number of individual texture uploads allowed per frame during deferred warmup. Prevents
; many small textures from causing a long frame even if they fit within the MB budget.
StartupTextureWarmupMaxUploadsPerFrame = 4
; Minimum free/available memory reserve to preserve during startup texture warmup. If available
; memory drops below this reserve, warmup pauses until memory recovers.
StartupMemoryReserveMB = 384
; Enables startup-time limits for primitive collision/hit-shape generation. This is meant to
; prevent very complex primitives from creating huge physics meshes and memory spikes.
; Do not use.
StartupLimitPrimitiveHitShapes = 0
; If a primitive has more than this many vertices, collision generation for that primitive is
; skipped. This is a hard safety cutoff for extremely large meshes.
StartupPrimitiveSkipCollisionAboveVertices = 250000
; Caps how many vertices a primitive collision mesh may use when the limiting path is active.
; Higher values preserve more collision detail; lower values reduce memory and startup cost.
StartupPrimitiveMaxCollisionVertices = 4096

; # PUP Tuning
; GBM producers. PUPGBMProducer / B2SGBMProducer are the master switches for their family: when a
; master is off the per-surface keys below it are never consulted. All default to 1.
PUPGBMProducer = 1
PUPBackglassGBMProducer = 1
PUPTopperGBMProducer =
PUPDMDGBMProducer =
PUPFullDMDGBMProducer =
; B2SGBMProducer is the master for the two below it, and is set up in the B2S block above.
B2SDMDGBMProducer =
B2SBackglassGBMProducer =
; Rockchip MPP hardware video decode. Enabled here because the cabinet images now grant the
; device permissions MPP needs; the code default is still off.
PUPRKMPPDecoder = 1
; Direct KMS scanout from the decoder is unstable -- keep this off.
PUPRKMPPDirectKMS = 0
PUPRKMPPComposited = 1
; Concurrent hardware decoders. 0 = no cap.
PUPRKMPPDecoderLimit = 0
; RKRGA/IM2D colour convert works on dma-buf sources only.
PUPRKRGAConvert = 0
PUPRKRGAAllowDrmStaging = 0
PUPRKRGAConvertScheduler = 0
PUPGBMProducerSlots = 3
PUPStaggerStartup = 1
PUPGpuYuvUpload = 0
PUPGpuYuvTargetFormat = 0

; # PUP FullDMD overlay
; A FullDMD pack draws a full backglass-shaped screen with a hole in it for the real DMD. These
; control compositing the PinMAME DMD into that hole.
; Hide the standalone PinMAME DMD window, on the assumption the FullDMD screen shows it instead.
; Defaults to whatever B2SDMDAutoPlacePUPDMD resolved to.
PUPFullDMDHidePinMAME =
; Actually composite the DMD into the FullDMD screen. Defaults to PUPFullDMDHidePinMAME --
; leaving this off while HidePinMAME is on means no DMD is visible anywhere.
PUPFullDMDCompositeDMD =
; Explicit overlay rectangle, in pixels on the FullDMD screen. Default -1 on all four, meaning
; "work it out" from the percentages and the dark-region detection below.
PUPFullDMDOverlayX =
PUPFullDMDOverlayY =
PUPFullDMDOverlayWidth =
PUPFullDMDOverlayHeight =
; Fallback placement when the rectangle above is left unset, as percentages of the screen.
; Defaults: width 70.0, centre X 50.0, centre Y 62.0.
PUPFullDMDOverlayWidthPercent =
PUPFullDMDOverlayCenterXPercent =
PUPFullDMDOverlayCenterYPercent =
; Auto-detection of the dark rectangle the artwork reserves for the DMD.
; A pixel darker than this luma counts as "hole". Default 72.0.
PUPFullDMDOverlayDetectDarkLuma =
; Ignore candidates above this line -- the top of the artwork is usually just a dark
; background. Default 30.0.
PUPFullDMDOverlayDetectMinYPercent =
; How far a candidate's aspect may stray from the DMD's before it is rejected. Default 5.0.
PUPFullDMDOverlayDetectAspectTolerancePercent =

