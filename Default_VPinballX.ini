; # DMD Streaming (Experimental)
DmdStream = 0
; Optional.
DmdStreamPort = 2113
; Optional encode cap. Default 30 fps, clamped to 1..120.
DmdStreamFps = 60
; Optional downscale (1200->640 keeps aspect). 0 = native.
DmdStreamMaxWidth = 0
; Which surface to mirror. "auto" picks the DMD; "*" mirrors any aux window (PUP/backglass);
; anything else must match an owner kind or window title exactly.
DmdStreamOwner = auto
DmdStreamRotate = 90
DmdStreamCodec = mjpeg
DmdStreamMjpegEncoder = turbo
DmdStreamChroma = 420
; Optional MJPEG qscale, 2 (best) .. 31 (worst).
DmdStreamQuality = 9
; Bind address. Default 0.0.0.0 (all interfaces).
DmdStreamAddr =
