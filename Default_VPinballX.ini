; # Player settings
[Player]
; Main audio settings
Sound3D = 0
SoundDevice =
SoundDeviceBG =
PlayMusic =
MusicVolume =
PlaySound =
SoundVolume =
; AudioDevice settings: 0 = miniaudio 1 = BASS
AudioDevice = 0

; Nudge
LRAxis =
LRAxisFlip =
UDAxis =
UDAxisFlip =
; Joystick axis selection. Unused by the RK3588 accelerometer path, which publishes into
; m_curAccel directly. Leave blank unless a real joystick is providing nudge.
PBWEnabled = 1
PBWNormalMount = 1
; Left/right-hand coordinates: flips the sign of the Y contribution. 1 is correct for the cabinet
; sensor -- a forward push then drives the ball UP the playfield. Flip to 0 if forward/back are
; reversed, and change nothing else: this is the only knob that should be used for that.
PBWDefaultLayout =
PBWRotationCB =
PBWRotationvalue =
; Rotates the nudge vector. Leave OFF. It was needed when the code was using the vertical axis as
; one of the two nudge axes; gravity-axis detection replaced that, and a rotation on top of
; correct axes just reintroduces cross-talk.
PBWAccelGainX = 230
PBWAccelGainY = 630
; Per-axis gain, percent. The ~3:1 ratio is not a fudge: measured on the cabinet, a firm side
; nudge produces ~0.40-0.50g while a firm forward nudge produces ~0.12-0.18g, because the cabinet
; is far stiffer front-to-back. Gain is applied AFTER normalization, so unlike 4kpAccelRangeG it
; adds force without clipping.
PBWAccelMaxX =
PBWAccelMaxY =
; Clamp, percent of full scale. Applies to the accelerometer path too (it goes through NudgeX/Y).
TiltSensitivity = 400
; Tilt sensitivity, thousandths. 0 disables tilt entirely. NOTE: TiltSensCB / TiltSensValue are
; write-only from the editor and are never read at load -- this is the key that matters.
EnableNudgeFilter =
EnableLegacyNudge =
LegacyNudgeStrength =
PlumbThresholdAngle	= 20
; Pole angle (degrees) the bob must swing past to trigger a tilt. Lower = more sensitive (tilts on a smaller swing). 5–45. Practical: 12 (twitchy) to 30 (very forgiving).
PlumbNudgeStrength = 15
; Force-normalized impulse given to the bob per genuine nudge. Applies to the KEY/script nudge path; the accelerometer path scales this by 4kpAccelTiltGain instead. 5–100.
PlumbInertia = 0.25
; Bob mass factor. Lower = more reactive (the nudge impulse moves a lighter bob further/faster); higher = sluggish, more damped. 0.1–1.0. Below ~0.15 gets jumpy; above ~0.5 feels heavy.
PlumbNudgeThreshold = 8
; Gate that separates a real nudge spike from the residual spring "ringing" after it. KEY/script path only -- the accelerometer never reaches m_tableVel, so this does not gate it. 4–15.

; Cabinet accelerometer (RK3588)
; Reads the ICM-426xx on i2c-9 straight off the kernel IIO device. Independent of the joystick/PBWAccel path and of AtGames' VirtualGamepad, which only powers the sensor when it runs as root — which it does not under EasyMode.
4kpAccelEnabled = 1
; Master switch. Needs /dev/iio:device* and its sysfs attributes accessible to the user VPX runs as (guest by default); if they are not, VPX logs a warning and simply runs without nudge. Look for "RK3588 accelerometer nudge active:" in the log to confirm it started.
4kpAccelDevice =
; sysfs device directory, e.g. /sys/bus/iio/devices/iio:device1. Empty = auto-detect by chip name.
4kpAccelRate = 200
; Sensor sample rate in Hz. 100 and 500 both verified on device. Higher = lower latency and more i2c traffic.
4kpAccelRangeG = 0.60
; Acceleration in g that maps to full nudge deflection. LOWER = more nudge per shove, but it
; divides BEFORE the clamp, so too low makes every firm nudge clip to the same value and hard and
; soft shoves feel identical. Size it above the hardest real nudge (~0.50g measured) and get
; strength from PBWAccelGainX/Y instead. 0.25–2.0.
4kpAccelVerticalAxis = -1
; -1 = detect the gravity axis at startup and use the other two as the cabinet plane (picks axis 1
; on these cabinets, leaving 0 and 2). 0/1/2 forces it. The driver's info_accel_matrix does NOT
; identify which axes are horizontal -- it maps chip axes to the device frame, and on these
; cabinets that leaves a full 1g on the device frame's Y.
4kpAccelDcTau = 1.0
; Gravity/DC removal time constant, seconds. Removes residual bias and slow tilt from the two
; horizontal axes (gravity itself is on the excluded vertical axis). Longer is safer with
; 4kpAccelKalman = 1; too short smears the nudge itself.
4kpAccelDeadzoneG = 0.015
; Accelerations below this (g) count as no nudge. Continuous, not a gate: the band is subtracted and the remainder rescaled, so gentle nudges keep their shape. Raise if the table drifts while the cabinet is still.
4kpAccelAutoOrient = 1
; Work out which plane axis is forward/back, and which way forward points, from the player's own
; nudges. Which axis comes from the cabinet being ~3x stiffer front-to-back than side-to-side, so
; the weaker axis is forward; which way comes from players pushing a cabinet and not pulling it,
; so the dominant peak sign is forward. Needs 8 nudges, a 1.5:1 axis ratio and a 65% sign majority
; before it commits; if the evidence stays weak it logs why and falls back to the three settings
; below. Set 0 to keep manual control.
4kpAccelInvertX = 1
; Left/right sign. NOT derivable -- the two directions are physically symmetric, so no measurement
; separates them. This one stays a preference: flip it if left and right come out reversed.
4kpAccelSwapXY = 1
4kpAccelInvertY = 0
4kpAccelFrontNudgePositive = 0
; Fallbacks, used only when 4kpAccelAutoOrient = 0 or auto-detect gives up. Measured on the
; cabinet: a forward nudge lands on device axis 0 and a right nudge on axis 2 (hence SwapXY = 1),
; and a forward push reads negative (hence FrontNudgePositive = 0). Getting FrontNudgePositive
; wrong silently discards every forward nudge while side nudges keep working -- which is exactly
; why auto-detect exists.
4kpAccelKalman = 1
; Upstream 10.8.1 MotionKalmanAxis (bias tracking + rest constraints) instead of the plain high-pass. 0 restores the simpler path, which makes this the A/B switch while tuning: if the feel gets worse, this tells you whether the filter or your tuning is responsible.
4kpAccelIntent = 1
; Upstream 10.8.1 NudgeIntentHandler: one clean ~25ms impulse per nudge instead of the whole
; waveform. Effectively required, not optional: without it the cabinet's rebound is fed to the
; table along with the push and a forward nudge largely cancels itself out.
4kpAccelIntentThreshold = 0.4
; Impulse gate in m/s^2. Upstream hardcodes 1.0, which is above what a normal forward nudge on
; this cabinet produces (~1.0 m/s^2 at the peak), so 1.0 discards most of them.
4kpAccelTiltThreshold = 0.20
; Minimum normalized nudge magnitude that counts as tilt-worthy at all. Gates; does not scale.
4kpAccelTiltGain = 0.15
; How hard a nudge drives the tilt bob, per unit of nudge. The primary tilt-sensitivity knob, and
; independent of nudge strength, so tilt and ball feel can be tuned separately. 0.02 (very
; forgiving) to 0.4 (twitchy).
4kpAccelStrengthScale = 1.0
; Scale on the filtered acceleration. Applied to the filter output, so unlike a raw gain it does not disturb rest detection. Secondary to 4kpAccelRangeG.
4kpAccelEmaTau = 0.004
; Smoothing of the Kalman acceleration state, seconds (upstream's value, tuned for 125Hz sensors). Used only when 4kpAccelKalman = 1 and 4kpAccelIntent = 0.

